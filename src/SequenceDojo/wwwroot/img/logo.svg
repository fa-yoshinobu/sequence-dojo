<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-label="シーケンス道場 3D">
  <title>シーケンス道場 3D</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2331"/>
      <stop offset="1" stop-color="#0e1218"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7a868"/>
      <stop offset="0.55" stop-color="#bf8a4a"/>
      <stop offset="1" stop-color="#9a6630"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#b6ffcc" stop-opacity="1"/>
      <stop offset="0.35" stop-color="#3ddc84" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#3ddc84" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>

  <style>
    /* 3.6 秒周期: 待機 → ボタンを押す → 接点 ON・通電・ランプ点灯 → 離す */
    .cap   { animation: press 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .tail  { animation: wave 0.9s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 0% 50%; }
    .onbar { animation: on 3.6s steps(1, end) infinite; }
    .flow  { stroke-dasharray: 10 8; animation: on 3.6s steps(1, end) infinite, dash 0.6s linear infinite; }
    .lamp  { animation: lamp 3.6s ease-out infinite; }
    .halo  { animation: lamp 3.6s ease-out infinite; }
    .spark { animation: spark 3.6s ease-out infinite; }
    .eyes  { animation: blink 3.6s steps(1, end) infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes press { 0%, 28% { transform: translateY(0) scaleY(1); } 33%, 80% { transform: translateY(7px) scaleY(0.82); } 86%, 100% { transform: translateY(0) scaleY(1); } }
    @keyframes on    { 0% { opacity: 0; } 33% { opacity: 1; } 82% { opacity: 0; } }
    @keyframes lamp  { 0%, 34% { opacity: 0; } 40% { opacity: 1; } 78% { opacity: 1; } 84%, 100% { opacity: 0; } }
    @keyframes spark { 0%, 33% { opacity: 0; transform: scale(0.4); } 38% { opacity: 1; transform: scale(1.1); } 50%, 100% { opacity: 0; transform: scale(1.4); } }
    @keyframes dash  { to { stroke-dashoffset: -18; } }
    @keyframes wave  { from { transform: rotate(-8deg); } to { transform: rotate(10deg); } }
    @keyframes blink { 0% { transform: scaleY(1); } 33% { transform: scaleY(0.15); } 80% { transform: scaleY(1); } }
    .spark { transform-box: fill-box; transform-origin: 50% 50%; }
    text { font-family: "Yu Gothic UI", "Meiryo", sans-serif; }
    .brush { font-family: "HG行書体", "HGGyoshotai", "HG正楷書体-PRO", "Yu Mincho", "YuMincho", "Hiragino Mincho ProN", serif; font-weight: 700; }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .onbar, .flow, .lamp, .halo { opacity: 1; } }
  </style>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- 吊り紐と看板 -->
  <path d="M230 0 L250 46 M570 0 L550 46" stroke="#8a7a62" stroke-width="4" stroke-linecap="round"/>
  <g>
    <rect x="148" y="42" width="504" height="150" rx="8" fill="#3b2410"/>
    <rect x="156" y="48" width="488" height="136" rx="5" fill="url(#wood)"/>
    <g stroke="#7a4d1f" stroke-opacity="0.35" fill="none" stroke-width="2">
      <path d="M170 76 C 260 66, 330 88, 420 74 S 590 70, 630 80"/>
      <path d="M166 150 C 250 160, 360 138, 460 152 S 600 158, 634 146"/>
      <path d="M190 118 C 230 112, 250 126, 300 118"/>
      <ellipse cx="560" cy="112" rx="16" ry="6"/>
    </g>
    <circle cx="176" cy="66" r="4" fill="#5a3818"/>
    <circle cx="624" cy="66" r="4" fill="#5a3818"/>
    <text class="brush" x="186" y="142" font-size="70" fill="#2a1608" textLength="408" lengthAdjust="spacingAndGlyphs">シーケンス道場</text>
  </g>

  <!-- 落款「3D」 -->
  <g transform="translate(632 184) rotate(-9)">
    <rect x="-34" y="-34" width="68" height="68" rx="6" fill="#c8241c"/>
    <rect x="-28" y="-28" width="56" height="56" rx="3" fill="none" stroke="#f6e7d8" stroke-width="2.5"/>
    <text x="0" y="12" text-anchor="middle" font-size="32" font-weight="800" fill="#f6e7d8">3D</text>
  </g>

  <!-- ラダー 1 段: 母線 ─┤X5├─────(PL1)─ 母線 -->
  <g stroke-linecap="round">
    <line x1="110" y1="262" x2="110" y2="372" stroke="#7d8794" stroke-width="5"/>
    <line x1="690" y1="262" x2="690" y2="372" stroke="#7d8794" stroke-width="5"/>
    <!-- 待機時の配線 -->
    <g stroke="#59616c" stroke-width="4">
      <line x1="110" y1="320" x2="300" y2="320"/>
      <line x1="340" y1="320" x2="534" y2="320"/>
      <line x1="586" y1="320" x2="690" y2="320"/>
    </g>
    <!-- 通電中（流れる破線） -->
    <g class="flow" stroke="#3ddc84" stroke-width="4">
      <line x1="110" y1="320" x2="300" y2="320"/>
      <line x1="340" y1="320" x2="534" y2="320"/>
      <line x1="586" y1="320" x2="690" y2="320"/>
    </g>
    <!-- a 接点 -->
    <line x1="300" y1="298" x2="300" y2="342" stroke="#dfe5ec" stroke-width="5"/>
    <line x1="340" y1="298" x2="340" y2="342" stroke="#dfe5ec" stroke-width="5"/>
    <rect class="onbar" x="305" y="301" width="30" height="38" rx="3" fill="#3ddc84" opacity="0"/>
  </g>
  <text x="320" y="370" text-anchor="middle" font-size="16" fill="#cfd6de">X5</text>
  <text x="320" y="390" text-anchor="middle" font-size="13" fill="#8b949e">PB1</text>

  <!-- ランプ（⊗） -->
  <circle class="halo" cx="560" cy="320" r="62" fill="url(#glow)" opacity="0"/>
  <circle cx="560" cy="320" r="26" fill="#18311f" stroke="#dfe5ec" stroke-width="4"/>
  <circle class="lamp" cx="560" cy="320" r="24" fill="#8ff0b4" opacity="0"/>
  <path d="M542 302 L578 338 M578 302 L542 338" stroke="#dfe5ec" stroke-width="3.5" stroke-linecap="round"/>
  <text x="560" y="370" text-anchor="middle" font-size="16" fill="#cfd6de">Y2</text>
  <text x="560" y="390" text-anchor="middle" font-size="13" fill="#8b949e">PL1</text>

  <!-- ハチマキ押しボタン君 -->
  <g>
    <rect x="178" y="278" width="72" height="16" rx="4" fill="#23272e" stroke="#0b0d10" stroke-width="2"/>
    <g class="cap">
      <rect x="186" y="232" width="56" height="46" rx="10" fill="#f4f4f2" stroke="#b9bdc4" stroke-width="2"/>
      <rect x="186" y="240" width="56" height="10" fill="#d42a2a"/>
      <g class="tail">
        <path d="M242 245 C 256 236, 262 244, 272 236" stroke="#d42a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
        <path d="M242 246 C 254 252, 262 250, 270 258" stroke="#d42a2a" stroke-width="5" fill="none" stroke-linecap="round"/>
      </g>
      <circle cx="241" cy="245" r="4.5" fill="#b01d1d"/>
      <g class="eyes">
        <ellipse cx="204" cy="261" rx="3.2" ry="4.2" fill="#1b1f25"/>
        <ellipse cx="224" cy="261" rx="3.2" ry="4.2" fill="#1b1f25"/>
      </g>
      <path d="M207 269 Q 214 274 221 269" stroke="#1b1f25" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    </g>
    <!-- 押した瞬間の火花 -->
    <g class="spark" opacity="0" stroke="#ffd34d" stroke-width="3" stroke-linecap="round">
      <line x1="172" y1="268" x2="160" y2="262"/>
      <line x1="172" y1="282" x2="158" y2="284"/>
      <line x1="256" y1="282" x2="270" y2="286"/>
    </g>
  </g>

  <text x="400" y="430" text-anchor="middle" font-size="17" fill="#9aa3ae" letter-spacing="1">技能検定［シーケンス制御作業］練習用 3D 作業盤</text>
</svg>
