name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Build solution
        run: |
          dotnet build SequenceDojo.sln -c Release --nologo -warnaserror
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test application without real PLC hardware
        run: |
          dotnet test SequenceDojo.sln -c Release --no-build --no-restore --nologo
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'

      - name: Test circuit calculations and task runner
        run: |
          node --test tests/browser/*.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Test release tools without external API calls
        run: |
          python -B -m unittest discover -s tests/release -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
